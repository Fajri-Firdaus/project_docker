services:
  app1-php:
    build: .
    container_name: app1-php
    volumes:
      - ./app1-form:/var/www/app1-form
    environment:
      - APP2_URL=http://nginx:8002/index.php

  app2-php:
    build: .
    container_name: app2-php
    volumes:
      - ./app2-receiver:/var/www/app2-receiver

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app1-form:/var/www/app1-form:ro
      - ./app2-receiver:/var/www/app2-receiver:ro
    ports:
      - "8001:8001"
      - "8002:8002"
    depends_on:
      - app1-php
      - app2-php